<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Biography of Safety — Museum reading room</title><style>body{margin:0;background:#faf7f1;color:#28282a;font:18px Georgia,serif}.loading{min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center}</style></head><body><div class="loading" role="status">Opening The Biography of Safety…</div><script>
(async()=>{try{
 const response=await fetch('https://raw.githubusercontent.com/TitanicParker/the-biography-of-safety/main/index.html',{cache:'no-store'});
 if(!response.ok)throw new Error('HTTP '+response.status);
 const html=await response.text();
 document.open();document.write(html);document.close();
}catch(e){document.querySelector('.loading').innerHTML='<p>The reading room is temporarily unavailable. <a href="https://github.com/TitanicParker/the-biography-of-safety">Open the source repository</a>.</p>';console.error(e)}})();
</script></body></html>
