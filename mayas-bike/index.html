<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maya's Bike</title>
<style>html,body{margin:0;min-height:100%;background:#f6f1e7;color:#201d19;font:18px/1.6 Georgia,serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem}.loading strong{display:block;font-size:2rem;font-weight:500}.loading span{display:block;margin-top:.6rem;color:#756e64;font:700 .7rem/1.4 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}</style>
</head>
<body>
<div class="loading"><div><strong>Maya’s Bike</strong><span>Opening the book…</span></div></div>
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/TitanicParker/mayas-bike/main/index.html';
    const r=await fetch(source,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    const sequel=`
<style>
.sequel-link{width:min(calc(100% - 2.2rem),43rem);margin:-2.5rem auto 6rem;padding:2rem 1.4rem;border:1px solid rgba(32,29,25,.12);border-radius:1rem;text-align:center;background:rgba(255,255,255,.22)}
.sequel-link .eyebrow{margin:0 0 .45rem;color:#756e64;font:750 .64rem/1.4 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.sequel-link h2{margin:0 0 .55rem;font:500 clamp(1.8rem,4vw,2.6rem)/1.05 Georgia,'Times New Roman',serif}
.sequel-link p{margin:.4rem auto 1rem;max-width:34rem;color:#756e64;font-size:.95rem;line-height:1.5}
.sequel-link a{display:inline-block;border-radius:999px;padding:.8rem 1rem;background:#7a4b36;color:#fffaf4;text-decoration:none;font:750 .72rem/1 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
@media(prefers-color-scheme:dark){.sequel-link{border-color:rgba(239,233,223,.14);background:rgba(255,255,255,.025)}.sequel-link .eyebrow,.sequel-link p{color:#aaa194}.sequel-link a{background:#d49a76;color:#261913}}
</style>
<section class="sequel-link" aria-labelledby="sequel-title">
  <p class="eyebrow">The story continues</p>
  <h2 id="sequel-title">Liam’s Case</h2>
  <p>The shed closes. The next book opens the case: a suitcase of documents, a medical record, and a question about what became settled.</p>
  <a href="https://titanicparker.github.io/liams-case/">Continue to the sequel →</a>
</section>`;
    html=html.replace('</footer>', '</footer>'+sequel);
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><div><strong>Maya’s Bike</strong><p>The book could not be opened just now.</p></div></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
