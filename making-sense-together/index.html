<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Making Sense Together</title>
<style>
html,body{margin:0;min-height:100%;background:#f6f0e5;color:#27241f;font:18px/1.6 Georgia,serif}
.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem}
.loading strong{display:block;font-size:2rem;font-weight:500}
.loading span{display:block;margin-top:.6rem;color:#716b61;font:700 .7rem/1.4 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
@media(prefers-color-scheme:dark){html,body{background:#171614;color:#eee9df}.loading span{color:#aaa297}}
</style>
</head>
<body>
<div class="loading"><div><strong>Making Sense Together</strong><span>Opening the book…</span></div></div>
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/TitanicParker/making-sense--together/main/index.html';
    const r=await fetch(source,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    const base='<base href="https://raw.githubusercontent.com/TitanicParker/making-sense--together/main/">';
    html=html.replace('<head>', '<head>'+base);
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><div><strong>Making Sense Together</strong><p>The book could not be opened just now.</p></div></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
