<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TitanicParker — Project Museum</title>
<style>html,body{margin:0;min-height:100%;background:#f2eee6;color:#191816;font:17px/1.6 Georgia,serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem}.loading strong{display:block;font-size:2rem;font-weight:500}.loading span{display:block;margin-top:.6rem;color:#6e675e;font:700 .7rem/1.4 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}</style>
</head>
<body>
<div class="loading"><div><strong>Project Museum</strong><span>Opening the collection…</span></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('./museum-core.html',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    const liam=`<section class="current" aria-labelledby="current-liams-case-title">
  <div>
    <div class="kicker">Sequel reading room</div>
    <h2 id="current-liams-case-title">Liam's Case</h2>
    <p>The sequel to <em>Maya's Bike</em>: a document-led reading room where the same concern with what becomes settled, inherited and left unresolved moves from the shed into a medical case record.</p>
  </div>
  <div class="current-links">
    <a class="primary-link" href="https://titanicparker.github.io/liams-case/">Open sequel</a>
    <a class="source-link" href="https://github.com/TitanicParker/Liams-case">Source</a>
  </div>
</section>\n\n`;
    const neuropathy=`<section class="current" aria-labelledby="current-neuropathy-question-title">
  <div>
    <div class="kicker">Current manuscript reading room</div>
    <h2 id="current-neuropathy-question-title">The Neuropathy Question</h2>
    <p>A manuscript-ready reading and listening room for the neuropathy inquiry. The publication is wired directly to the evolving <code>manuscript.md</code> in the source repository.</p>
  </div>
  <div class="current-links">
    <a class="primary-link" href="https://titanicparker.github.io/the-neuropathy-question/">Open reading room</a>
    <a class="source-link" href="https://github.com/TitanicParker/the-neuropathy-question">Source</a>
  </div>
</section>\n\n`;
    const eye=`<section class="current" aria-labelledby="current-eye-argument-title">
  <div>
    <div class="kicker">Current manuscript reading room</div>
    <h2 id="current-eye-argument-title">The Eye of the Argument</h2>
    <p>The live reading room for <em>What Happened to the Feet</em>, wired directly to the evolving <code>manuscript.md</code> in the source repository.</p>
  </div>
  <div class="current-links">
    <a class="primary-link" href="https://titanicparker.github.io/the-eye-of-the-argument/">Open reading room</a>
    <a class="source-link" href="https://github.com/TitanicParker/the-eye-of-the-argument">Source</a>
  </div>
</section>\n\n`;
    html=html.replace('<div class="controls" aria-label="Museum search">',liam+neuropathy+eye+'<div class="controls" aria-label="Museum search">');
    html=html.replace("archived.length+3","archived.length+6");
    html=html.replace("Current legal work, Spot On and Maya's Bike are foregrounded.","Current legal work, Spot On, Maya's Bike, Liam's Case, The Neuropathy Question and The Eye of the Argument are foregrounded.");
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><div><strong>Project Museum</strong><p>The collection could not be opened just now.</p></div></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
